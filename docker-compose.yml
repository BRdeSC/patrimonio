# Postgres para o app Patrimônio.
# Em dev local pode-se usar um Postgres já disponível (ver README — .env aponta p/ localhost:5432).
# Segredos: em produção, sobrescreva via env (POSTGRES_USER/POSTGRES_PASSWORD/POSTGRES_DB) — nunca versionar .env.
services:
  db:
    image: postgres:16
    container_name: patrimonio-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-patrimonio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-patrimonio}
      POSTGRES_DB: ${POSTGRES_DB:-patrimonio}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - patrimonio_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # App inteiro em 1 container stateless (1 imagem). Schema aplicado no boot
  # (entrypoint: prisma db push idempotente; SEED_ON_BOOT=1 semeia o demo).
  web:
    build:
      context: .
      # Subpath de deploy (ex.: /patrimonio) — build-time (inlinado nos assets).
      # O compose lê o .env automaticamente: o MESMO NEXT_PUBLIC_BASE_PATH do
      # dev define o path do build (vazio = raiz).
      args:
        NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-}
    container_name: patrimonio-web
    restart: unless-stopped
    # "3100:3000" evita conflito com `npm run dev` local (porta 3000).
    # Para usar a 3000: parar o dev e sobrescrever o mapping.
    ports:
      - "3100:3000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Interpola as MESMAS vars do service db: sobrescrever POSTGRES_USER/PASSWORD/DB
      # (ex.: volume já existente) não quebra o web→db silenciosamente (GATE 1 ③-C D1).
      DATABASE_URL: postgresql://${POSTGRES_USER:-patrimonio}:${POSTGRES_PASSWORD:-patrimonio}@db:5432/${POSTGRES_DB:-patrimonio}?schema=public
      # Sessão: defina via env em produção (ex.: SESSION_SECRET=$(openssl rand -hex 32) docker compose up -d)
      SESSION_SECRET: ${SESSION_SECRET:-troque-por-um-segredo-longo-e-aleatorio}
      # Autenticação: mock em dev; ldaps no ⑧ (descomentar os envs e o volume do CA)
      #IPA_MODE: ${IPA_MODE:-mock}
      IPA_MODE: ${IPA_MODE:-ldaps}
      # Seed de demonstração no boot (0 = off): SEED_ON_BOOT=1 docker compose up -d
      SEED_ON_BOOT: ${SEED_ON_BOOT:-0}
      # FreeIPA (CPTEC/INPE):
      IPA_LDAPS_URL: ${IPA_LDAPS_URL:-ldaps://ipa.cptec.inpe.br:636}
      IPA_BASE_DN: ${IPA_BASE_DN:-cn=users,cn=accounts,dc=cptec,dc=inpe,dc=br}
      IPA_CA_CERT: ${IPA_CA_CERT:-/run/secrets/freeipa_chave_operacional.pem}
    volumes:
      - ./secrets/freeipa_chave_operacional.pem:/run/secrets/freeipa_chave_operacional.pem:ro

volumes:
  patrimonio_pgdata:
